name: Deploy release feed to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/updates/
            !/old_updates/
          sparse-checkout-cone-mode: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build the release feed
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate the release feed
        shell: bash
        run: |
          set -euo pipefail

          test -s _site/appcast.xml
          test -s _site/Secondlight-v3.7.5.html

          site_size_kb="$(du -sk _site | awk '{print $1}')"
          if (( site_size_kb > 10240 )); then
            echo "Refusing to deploy an unexpectedly large Pages artifact (${site_size_kb} KB)." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
