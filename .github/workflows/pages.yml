name: Deploy release feed to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage the release feed
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site
          cp appcast.xml index.html README.md _site/
          find . -maxdepth 1 -type f -name '*.html' -exec cp {} _site/ \;

          if [[ -d assets ]]; then
            cp -R assets _site/assets
          fi

          touch _site/.nojekyll
          test -s _site/appcast.xml
          test -s _site/Secondlight-v3.7.5.html

          site_size_kb="$(du -sk _site | awk '{print $1}')"
          if (( site_size_kb > 10240 )); then
            echo "Refusing to deploy an unexpectedly large Pages artifact (${site_size_kb} KB)." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
